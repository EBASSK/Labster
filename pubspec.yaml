name: lab_instrument_identifier
description: Labster - Identificador de instrumentos de laboratorio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  camera: ^0.11.2+1
  flutter:
    sdk: flutter
  flutter_riverpod: 2.4.0
  go_router: ^17.0.0
  image: ^4.0.20
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.7.0
  path: ^1.8.3
  path_provider: ^2.0.15
  permission_handler: ^12.0.1
  sqflite: ^2.2.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/instrument_model.tflite
    - assets/models/labels.txt
    - assets/models/model_contract.json
    - assets/imagenes/labster_logo.png
